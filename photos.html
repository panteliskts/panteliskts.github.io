<!DOCTYPE html>
<html lang="en">
<head>
<title>Photography &mdash; Pantelis Kotsas</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  :root {
    --accent: #1a56db;
    --accent-dark: #1e40af;
    --subtle: #6b7280;
    --bg: #f9fafb;
    --bg-card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", sans-serif; color: var(--text); background: var(--bg); margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Navbar ── */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 60px;
  }
  .navbar-brand { font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
  .navbar-brand:hover { text-decoration: none; }
  .navbar-links { display: flex; gap: 4px; align-items: center; }
  .navbar-links a {
    color: var(--text-muted); font-size: 0.875rem; font-weight: 500;
    padding: 6px 14px; border-radius: 6px; transition: background 0.15s, color 0.15s;
  }
  .navbar-links a:hover { background: var(--bg); color: var(--text); text-decoration: none; }
  .navbar-links a.active { color: var(--accent); background: #eff6ff; }
  .navbar-links a.nav-cta { background: var(--accent); color: #fff; margin-left: 6px; }
  .navbar-links a.nav-cta:hover { background: var(--accent-dark); }
  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--text); margin: 5px 0; border-radius: 2px; }

  /* ── Page Header ── */
  .page-header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 36px 40px 28px;
  }
  .page-header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .page-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; }
  .page-header .sub { font-size: 0.875rem; color: var(--text-muted); margin: 0; }
  .vsco-link {
    display: inline-flex; align-items: center; gap: 8px;
    background: #111; color: #fff;
    padding: 9px 18px; border-radius: 6px;
    font-size: 0.875rem; font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .vsco-link:hover { background: #333; text-decoration: none; color: #fff; }

  /* ── Gallery ── */
  .gallery-wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 60px; }
  .gallery-grid {
    columns: 3; column-gap: 10px;
  }
  .gallery-grid img {
    width: 100%; display: block;
    margin-bottom: 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .gallery-grid img:hover { opacity: 0.88; }

  /* ── Lightbox ── */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: absolute; top: 20px; right: 28px;
    color: #fff; font-size: 2rem; cursor: pointer; line-height: 1;
    background: none; border: none; padding: 0;
  }
  .lightbox-close:hover { color: #ccc; }

  /* ── Footer ── */
  .site-footer {
    background: #fff; border-top: 1px solid var(--border);
    text-align: center; padding: 28px 24px; font-size: 0.82rem; color: var(--text-muted);
  }
  .site-footer .footer-icons { display: flex; justify-content: center; gap: 18px; margin-bottom: 12px; font-size: 1.2rem; }
  .site-footer .footer-icons a { color: var(--text-muted); transition: color 0.15s; }
  .site-footer .footer-icons a:hover { color: var(--accent); text-decoration: none; }

  /* ── Mobile ── */
  @media (max-width: 680px) {
    .navbar { padding: 0 20px; }
    .navbar-links { display: none; flex-direction: column; gap: 0; position: absolute; top: 60px; left: 0; right: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 8px 12px 12px; z-index: 99; }
    .navbar-links.open { display: flex; }
    .navbar-links a.nav-cta { margin-left: 0; margin-top: 4px; }
    .hamburger { display: block; }
    .page-header { padding: 24px 20px 20px; }
    .gallery-wrap { padding: 20px 16px 40px; }
    .gallery-grid { columns: 2; }
  }
  @media (max-width: 420px) {
    .gallery-grid { columns: 1; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">Pantelis Kotsas</a>
  <div class="navbar-links" id="navLinks">
    <a href="index.html#about">About</a>
    <a href="index.html#education">Education</a>
    <a href="index.html#skills">Skills</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#certifications">Certifications</a>
    <a href="photos.html" class="nav-cta active">Photography</a>
  </div>
  <button class="hamburger" onclick="toggleNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1>Photography</h1>
      <p class="sub">A collection of photos taken over the years.</p>
    </div>
    <a href="https://photos.app.goo.gl/kgnmb33NV6Rupnkv8" target="_blank" class="vsco-link">
      <i class="fa fa-camera"></i> View on Google Photos
    </a>
  </div>
</div>

<!-- Gallery -->
<div class="gallery-wrap">
  <div class="gallery-grid" id="photoGrid">
    <img src="images/File_000.png" alt="Photo" onclick="openLightbox(this)">
    <img src="images/img2.png" alt="Photo" onclick="openLightbox(this)">
    <img src="images/pexels-mutecevvil-28871575.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/File_001.png" alt="Photo" onclick="openLightbox(this)">
    <img src="images/tv tower night.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/gold.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_2476.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_1270.JPG" alt="Photo" onclick="openLightbox(this)">
    <img src="images/lion.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/calm plants.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_2335.JPG" alt="Photo" onclick="openLightbox(this)">
    <img src="images/waterfall.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_2692.JPG" alt="Photo" onclick="openLightbox(this)">
    <img src="images/river.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_2690.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/IMG_5081.jpg" alt="Photo" onclick="openLightbox(this)">
    <img src="images/sea.jpg" alt="Photo" onclick="openLightbox(this)">
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Footer -->
<footer class="site-footer">
  <div class="footer-icons">
    <a href="https://www.facebook.com/profile.php?id=100048853928419" target="_blank" title="Facebook"><i class="fa fa-facebook-official"></i></a>
    <a href="https://www.instagram.com/panteliskotsas" target="_blank" title="Instagram"><i class="fa fa-instagram"></i></a>
    <a href="https://www.linkedin.com/in/pantelis-kotsas-46861a299/" target="_blank" title="LinkedIn"><i class="fa fa-linkedin"></i></a>
    <a href="https://github.com/panteliskts" target="_blank" title="GitHub"><i class="fa fa-github"></i></a>
    <a href="mailto:pandeliskotsas@gmail.com" title="Email"><i class="fa fa-envelope"></i></a>
    <a href="https://photos.app.goo.gl/kgnmb33NV6Rupnkv8" target="_blank" title="Google Photos"><i class="fa fa-camera"></i></a>
  </div>
  <p style="margin:0;">&copy; 2026 Pantelis Kotsas &nbsp;&middot;&nbsp; Athens, Greece</p>
</footer>

<script>
  function toggleNav() {
    document.getElementById("navLinks").classList.toggle("open");
  }

  function openLightbox(img) {
    document.getElementById("lightboxImg").src = img.src;
    document.getElementById("lightbox").classList.add("open");
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeLightbox();
  });
</script>

</body>
</html>
